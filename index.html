<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my gallery</title>
<style>
  :root {
    --bg: #111111;
    --text: #f0f0f0;
    --muted: #888888;
    --slot-bg: #1c1c1c;
    --slot-border: #2c2c2c;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 60px 24px 100px;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font-size: 2.4rem;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p.description {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 600px;
    line-height: 1.5;
    margin: 0 0 48px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .slot {
    aspect-ratio: 1 / 1;
    background: var(--slot-bg);
    border: 1px solid var(--slot-border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
  }
  .slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
    cursor: pointer;
  }
  .overlay.open {
    display: flex;
  }
  .overlay img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>goldtro exposure (reuploaded)</h1>
    <p class="description">oh noooo goldtro exposed...... ok look at images below. site is open source at https://github.com/lacksonz/GoldTroExposure/blob/main/index.html , contact @lackson if you want to add any images. in the end, GPT and goldtro are just losers. fuck anyone inside GPT</p>
    <div class="grid">
     <div class="slot"><img src="images/Screenshot_20260619_194033_Chrome.jpg"></div>
      <div class="slot"><img src="images/IMG_8398.png"></div>
      <div class="slot"><img src="images/IMG_8399.png"></div>
      <div class="slot"><img src="images/IMG_8400.png"></div>
      <div class="slot"><img src="images/IMG_8401.png"></div>
      <div class="slot"><img src="images/IMG_8402.png"></div>
      <div class="slot"><img src="images/IMG_8404.png"></div>
      <div class="slot"><img src="images/image.png"></div>
      <div class="slot"><img src="images/imageS2.png"></div>
      <div class="slot"><img src="images/IMG_2275.png"></div>
      <div class="slot"><img src="images/imagese.png"></div>
      <div class="slot"><img src="images/imagesa.png"></div>
      <div class="slot"><img src="images/image64"></div>
      <div class="slot"><img src="images/goldtroexpose1.png"></div>
      <div class="slot"><img src="images/goldtroexpose.png"></div>
      <div class="slot"><img src="images/iimage.png"></div>
      <div class="slot"><img src="images/image61.png"></div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <img id="overlayImg" src="">
  </div>
  <script>
    const overlay = document.getElementById("overlay");
    const overlayImg = document.getElementById("overlayImg");
    document.querySelectorAll(".slot img").forEach(img => {
      img.addEventListener("click", () => {
        if (!img.src) return;
        overlayImg.src = img.src;
        overlay.classList.add("open");
      });
    });
    overlay.addEventListener("click", () => {
      overlay.classList.remove("open");
    });
  </script>
</body>
</html>
